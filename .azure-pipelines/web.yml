trigger:
  branches:
    include:
      - pdr
      - des
  paths:
    include:
      - apps/web/*

pr:
  branches:
    include:
      - pdr
      - des
  paths:
    include:
      - apps/web/*

pool:
  vmImage: 'ubuntu-latest'

jobs:
  - job: lint_and_build
    displayName: 'Lint and Build'
    steps:
      - checkout: self

      - task: NodeTool@0
        inputs:
          versionSpec: '24.x'
        displayName: 'Setup Node'

      - task: Cache@2
        inputs:
          key: 'npm | "$(Agent.OS)" | package-lock.json'
          restoreKeys: |
            npm | "$(Agent.OS)"
          path: $(Pipeline.Workspace)/.npm
        displayName: 'Cache npm packages'

      - script: npm ci --cache $(Pipeline.Workspace)/.npm
        displayName: 'Install dependencies'

      - script: npm run lint --workspace=apps/web
        displayName: 'Run lint'

      - script: npm run build --workspace=apps/web
        displayName: 'Build (typecheck + vite build)'