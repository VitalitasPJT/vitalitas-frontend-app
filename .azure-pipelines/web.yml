trigger:
  branches:
    include:
      - pdr
      - des
  paths:
    include:
      - apps/web/*

pr:
  branches:
    include:
      - pdr
      - des
  paths:
    include:
      - apps/web/*

pool:
  vmImage: 'ubuntu-latest'

jobs:
  - job: lint_typecheck_build
    displayName: 'Lint, Typecheck and Build'
    steps:
      - checkout: self

      - task: NodeTool@0
        inputs:
          versionSpec: '24.x'
        displayName: 'Setup Node'

      - task: Cache@2
        inputs:
          key: 'npm | "$(Agent.OS)" | package-lock.json'
          restoreKeys: |
            npm | "$(Agent.OS)"
          path: $(npm_config_cache)
        displayName: 'Cache npm packages'

      - script: npm install
        displayName: 'Install dependencies'

      - script: npm run lint --workspace=web
        displayName: 'Run lint'

      - script: npm run typecheck --workspace=web
        displayName: 'Run typecheck'

      - script: npm run build --workspace=web
        displayName: 'Build (vite build)'