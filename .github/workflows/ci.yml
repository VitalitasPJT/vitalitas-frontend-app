name: CI

on:
  pull_request:
    branches: [pdr, des]
    paths:
      - 'apps/mobile/**'
  push:
    branches: [pdr, des]
    paths:
      - 'apps/mobile/**'

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run lint
        run: npm run lint --workspace=mobile

      - name: Run typecheck
        run: npm run typecheck --workspace=mobile